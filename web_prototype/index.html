<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Easy CAD 웹 프로토타입 — 포트/커넥터</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toolbar">
    <button id="save-btn" type="button">저장</button>
    <button id="load-btn" type="button">열기</button>
    <input id="load-input" type="file" accept="application/json" hidden />
    <button id="undo-btn" type="button" disabled>되돌리기</button>
    <button id="redo-btn" type="button" disabled>다시실행</button>
    <button id="grid-btn" type="button" class="toggled">격자(G)</button>
    <span class="toolbar-sep"></span>
    <button id="kind-rect-btn" type="button" class="toggled" data-kind="rect">사각형</button>
    <button id="kind-ellipse-btn" type="button" data-kind="ellipse">타원</button>
    <button id="kind-diamond-btn" type="button" data-kind="diamond">마름모</button>
    <span class="toolbar-sep"></span>
    <span id="fill-swatches">
      <button type="button" class="swatch" data-color="#FF3B30" style="background:#FF3B30" title="빨강"></button>
      <button type="button" class="swatch" data-color="#FF9500" style="background:#FF9500" title="주황"></button>
      <button type="button" class="swatch" data-color="#FFCC00" style="background:#FFCC00" title="노랑"></button>
      <button type="button" class="swatch" data-color="#34C759" style="background:#34C759" title="초록"></button>
      <button type="button" class="swatch" data-color="#007AFF" style="background:#007AFF" title="파랑"></button>
      <button type="button" class="swatch" data-color="#FFFFFF" style="background:#FFFFFF" title="흰색"></button>
      <button id="fill-reset-btn" type="button" class="swatch swatch-reset" title="기본색으로"></button>
      <button id="fill-custom-btn" type="button">다른 색…</button>
      <input id="fill-custom-input" type="color" hidden />
    </span>
  </div>
  <div id="status" data-shape-count="2" data-arrow-count="0" data-hovered-port="none" data-selected-count="0" data-selected-arrow="none" data-undo-count="0" data-redo-count="0" data-zoom="1.000" data-view-x="0.0" data-view-y="0.0" data-grid-enabled="true" data-next-kind="rect">
    shapes: <span id="shape-count">2</span> / arrows: <span id="arrow-count">0</span>
    (더블클릭으로 도형 추가 — 사각형/타원/마름모 버튼으로 종류 선택, 빈 캔버스 드래그로 다중선택,
    Ctrl+Z/Ctrl+Shift+Z로 되돌리기/다시실행, 휠로 확대/축소, 휠버튼 드래그로 캔버스 이동,
    G로 격자·스냅 토글, 화살표 클릭으로 선택 후 Delete로 삭제, 화살표 더블클릭으로 라벨 편집,
    Ctrl+A로 전체선택, +/-로 확대·축소, 0으로 줌 리셋, 방향키로 선택 도형 미세이동(Shift/Ctrl
    누르면 1px))
  </div>
  <svg id="canvas" viewBox="0 0 800 500" width="800" height="500">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#333" />
      </marker>
      <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="0" cy="0" r="1.2" fill="#c7c7c7" />
      </pattern>
    </defs>
    <rect id="grid-bg" x="-100000" y="-100000" width="200000" height="200000" fill="url(#grid-pattern)" />
    <g class="shapes"></g>
    <g class="arrows"></g>
    <g class="selection"></g>
    <g class="drag-preview"></g>
  </svg>
  <script type="module" src="main.js"></script>
</body>
</html>
