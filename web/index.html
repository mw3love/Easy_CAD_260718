<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic Board</title>
  <!-- 탭 아이콘(없어서 favicon 404가 났고, 탭 여럿 중에 찾기도 어려웠음 — 2026-10-19 점검): 코랄 칠판 + 흰 글줄 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='24' rx='5' fill='%23da7756'/%3E%3Cpath d='M8 12h16M8 17h12M8 22h8' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <!-- 어두운 화면을 앱이 직접 그린다 — 브라우저 자동 다크·다크 확장이 흰 페이지를 강제로 바꾸지 않게(바꾸면 바탕·선 색이 데스크톱과 달라진다) -->
  <meta name="color-scheme" content="light dark">
  <meta name="darkreader-lock">
  <link rel="stylesheet" href="/fonts.css?v=3">
  <style>
    [data-folded]>:not(:first-child){display:none!important}   /* 접은 카드 = 제목 줄만(fold.jsx) */
    html,body,#root{margin:0;height:100%;overflow:hidden}
    /* 화면 색 — 어두운 쪽은 데스크톱 `_dark_palette`·`_CANVAS_BG["dark"]`와 같은 값 */
    :root{--mb-icon-acc:#2563eb;--mb-on:rgba(218,119,86,.22);--mb-on-ring:inset 0 0 0 1px #c4613f;--mb-ctl:#8b8b94;--mb-row-on:#dfe5eb;--mb-group-hover:#d8d8de;--mb-shadow:0 6px 18px rgba(0,0,0,.18);--mb-shadow-lg:0 8px 28px rgba(0,0,0,.25);color-scheme:light;--mb-bar:#f4f4f5;--mb-group:#e9e9ec;--mb-ink:#27272a;--mb-muted:#63636b;--mb-icon:#39434f;--mb-board:#ffffff;--mb-line:#e4e4e7;--mb-card:#ffffff;--mb-seg:#f4f4f5;--mb-onbg:#fbeee8;--mb-editbg:rgba(255,255,255,.9);--mb-accent:#da7756;--mb-pick:#e4e4e7;--mb-danger-ink:#b9342f;--mb-link:#1d4ed8}
    :root[data-theme=dark]{--mb-icon-acc:#7aa8ff;--mb-ctl:#5f7083;--mb-row-on:#283039;--mb-group-hover:#2a3646;color-scheme:dark;--mb-bar:#171e26;--mb-group:#1d2632;--mb-ink:#ffffff;--mb-muted:#8a98a8;--mb-icon:#cdd8e3;--mb-board:#1e2731;--mb-line:#2a3542;--mb-card:#171e26;--mb-seg:#1d2632;--mb-onbg:#4a2c22;--mb-editbg:rgba(30,39,49,.92);--mb-pick:#2c3846;--mb-danger-ink:#f2766f;--mb-link:#6ea8ff}
    /* 2026-11-09 better-interface 점검: 라이트 보조 글 #71717a는 회색 칸·판 바탕에서 대비 4.5 미만(3.99·4.40) → #63636b. 빨간 글은 글 전용 색(--mb-danger-ink — 단추 바탕 #d44c47은 그대로) */
    /* 글쇠로 옮겨 다닐 때 초점 표시 — 단추들이 all:unset이라 브라우저 기본 테두리가 지워졌음(같은 점검). 마우스로 누를 땐 안 뜸(:focus-visible). data-own-ring = 확인 창처럼 제 테두리가 있는 단추 */
    button:not([data-own-ring]):focus-visible,[role=button]:focus-visible,[role=switch]:focus-visible,[role=separator]:focus-visible,.mb-row a:focus-visible,.mb-skip:focus-visible{outline:2px solid var(--mb-icon-acc)!important;outline-offset:2px}
    .mb-chat button:disabled{opacity:.45;cursor:default!important}   /* 대화창 못 누르는 단추 — 색·커서가 누를 수 있는 단추와 똑같았음(2026-11-09 점검) */
    .mb-field:focus,.mb-field:focus-within{border-color:var(--mb-icon-acc)!important}   /* 글 칸 초점 = 테두리 파랑(대화창 — 2026-11-09 점검, outline:none이라 아무 표시 없었음) */
    .mb-chat button.mb-send:disabled{opacity:1}   /* 입력부 ↑ — 못 누를 땐 회색 원 자체가 표시(더 흐리면 안 보임) */
    .mb-field:not(:focus):not(:focus-within){border-color:var(--mb-ctl)!important}   /* 글 칸 테두리 = 카드와 3:1 이상(0단계 B3 — 구분선 --mb-line은 1.3) */
    .mb-btn-icon svg [stroke-width]{stroke-width:1.6}   /* 위 막대·왼쪽 판 아이콘 선 굵기 하나로(0단계 B6 — 1.2~2.2 제각각, icons.json은 데스크톱에서 뽑으니 여기서) */
    label:has(>input[type=color]:focus-visible){outline:2px solid var(--mb-icon-acc);outline-offset:2px}   /* 색 창 「다른 색」 — 진짜 칸은 투명이라 둘레에 */
    [data-testid=props-card] button:not(:disabled):hover,[data-ppop] button:not(:disabled):hover,[data-testid=ai-panel] button:not(:disabled):hover{background-image:linear-gradient(rgba(127,127,127,.14),rgba(127,127,127,.14))!important}   /* 속성 카드·펼침·AI 창 마우스 올림 = 회색 겹침(2026-11-10 4단계 — 올려도 변화가 없었음) */
    .mb-row:focus-visible,.mb-row a:focus-visible{outline-offset:-2px!important}
    .mb-skip{position:fixed;left:8px;top:-60px;z-index:2000;padding:8px 14px;border-radius:8px;background:var(--mb-card);color:var(--mb-ink);font:600 13px 'Pretendard',sans-serif;box-shadow:var(--mb-shadow);text-decoration:none}.mb-skip:focus{top:8px}   /* 글쇠로만 보이는 「건너뛰기」(2026-11-10 1단계 — 위 막대 Tab 25번) */   /* 목록 칸이 굴림 칸이라 바깥 테두리는 잘림 — 줄 안쪽에 */
    .mb-row:focus-within .mb-more{visibility:visible!important}   /* 줄 ⋯는 마우스 올림 때만(규칙 ④) + 글쇠로 그 줄에 왔을 때도 */
    .mb-hit::after{content:'';position:absolute;inset:var(--hit,-3px)}   /* 겉모양은 작게 두고 누르는 자리만 24px로(2026-11-09 점검 — ⋯ 18·▾ 22×20) */
    .mb-dlg::backdrop{background:transparent}   /* 확인 창 바탕은 창이 직접 칠함(ui.jsx Confirm) */
    .mb-btn-icon svg [fill="currentColor"]{fill:var(--mb-icon-acc)}
    @media (max-width:1039px){[data-cmd-btn]{display:none!important}}
  </style>
  <script>/* 첫 화면부터 맞는 색(깜빡임 없이) — 고른 값이 없으면 시스템 설정을 따름 */
    try { const t = localStorage.getItem('mb.theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') } catch { document.documentElement.dataset.theme = 'light' }</script>
</head>
<body><div id="root"></div>
  <script>/* 앱이 그려지기 전(글꼴·로그인 확인을 기다리는 0.0x초) 빈 틀 — 하얀 화면이 한 번 번쩍였음(2026-10-28 사용자 「새 칠판 누르면 살짝 깜빡」, 녹화 4번 중 1번).
    위 막대·왼쪽 판·대화창 자리를 이 브라우저가 기억한 폭 그대로 칠함(main.jsx `mb-dock`·`mb-dock-w`·`mb-chat-open`·`mb-chat-w`, 위 막대 높이 = 넓은 창 54·좁은 창 39). React가 그리면 통째로 바뀜 */
    try { const q = new URLSearchParams(location.search), W = innerWidth, phone = matchMedia('(pointer: coarse)').matches && W < 700
      if (!q.get('view') && !phone) { const g = (k, d) => { const v = localStorage.getItem(k); return v == null ? d : v }, narrow = W < 1440, top = narrow ? 39 : 54
        const dock = g('mb-dock', narrow ? '' : 'shape'), dw = Math.max(192, Math.min(400, +g('mb-dock-w', 192) || 192)), chat = g('mb-chat-open', '1') !== '0', cw = Math.max(320, Math.min(720, +g('mb-chat-w', 360) || 360))
        const box = s => `<div style="position:absolute;box-sizing:border-box;${s}"></div>`, bar = 'background:var(--mb-bar);border:0 solid var(--mb-line);'
        document.getElementById('root').innerHTML = `<div style="position:relative;height:100%;background:var(--mb-board)">` + box(`${bar}left:0;top:0;right:0;height:${top}px;border-bottom-width:1px`)
          + box(`${bar}left:0;top:${top}px;bottom:0;width:${dock ? 41 + dw + 1 : 40}px;border-right-width:1px`) + (dock ? box(`left:40px;top:${top}px;bottom:0;border-left:1px solid var(--mb-line)`) : '')
          + (dock && !narrow && 42 + dw <= W - 1180 ? box(`background:var(--mb-bar);left:0;top:${top - 1}px;width:${41 + dw}px;height:1px`) + box(`background:var(--mb-line);left:${41 + dw}px;top:0;width:1px;height:${top}px`) : '')   /* 왼쪽 판이 위 막대 끝까지(main.jsx headed) */
          + (chat ? (narrow ? box(`${bar}right:12px;top:${top + 12}px;bottom:12px;width:${cw + 2}px;border-width:1px;border-radius:12px`) : box(`${bar}right:0;top:${top}px;bottom:0;width:${cw + 1}px;border-left-width:1px`)) : '') + '</div>' }
    } catch { /* 못 그려도 앱은 그대로 */ }</script>
  <script type="module" src="/src/next/main.jsx"></script></body>
</html>
